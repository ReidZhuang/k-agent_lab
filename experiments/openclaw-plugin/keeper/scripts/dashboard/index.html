<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>keeper 驾驶舱</title>
<style>
  :root {
    --bg: #10151c; --panel: #171e28; --panel2: #1e2733; --line: #2a3646;
    --text: #dbe4ee; --dim: #8aa0b8; --acc: #4cc2ff; --good: #3ddc97; --warn: #ffb454;
    --bad: #ff6b6b; --u: #9b8cff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.55 "SF Mono", "Cascadia Code", Consolas, "Noto Sans Mono CJK SC", monospace; }
  header { display: flex; align-items: center; gap: 16px; padding: 12px 20px;
    border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 5; }
  header h1 { font-size: 16px; margin: 0; }
  header select, header button { background: var(--panel2); color: var(--text);
    border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; font: inherit; }
  #conn { font-size: 12px; color: var(--dim); }
  #conn.live { color: var(--good); } #conn.err { color: var(--bad); }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 14px; padding: 14px 20px; }
  @media (max-width: 960px) { main { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  .card h2 { font-size: 13px; margin: 0 0 10px; color: var(--dim); text-transform: uppercase; letter-spacing: .05em; }
  /* timeline */
  #timeline { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; max-height: calc(100vh - 120px); }
  .ev { border: 1px solid var(--line); border-left-width: 4px; border-radius: 8px; padding: 8px 10px; background: var(--panel2); }
  .ev .h { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; margin-bottom: 4px; }
  .ev .tag { font-weight: 700; }
  .ev .meta { color: var(--dim); }
  .ev code { background: #0d131b; border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; font-size: 12px; }
  .ev.c-tool_call { border-left-color: var(--acc); }
  .ev.c-discard_applied { border-left-color: var(--good); }
  .ev.c-assistant_discard { border-left-color: var(--acc); }
  .ev.c-tagger_doc { border-left-color: var(--u); }
  .ev.c-view_before, .ev.c-view_after { border-left-color: var(--warn); }
  .ev.c-token_round { border-left-color: var(--good); }
  .ev.c-tool_result_error, .ev.c-discard_empty, .ev.c-compress_skip { border-left-color: var(--bad); }
  .del { color: var(--bad); text-decoration: line-through; }
  table { border-collapse: collapse; width: 100%; font-size: 12px; }
  th, td { border: 1px solid var(--line); padding: 3px 6px; text-align: left; }
  th { color: var(--dim); background: var(--panel2); }
  .n-del { color: var(--bad); }
  /* token panel */
  .tokens { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .tokens .big { font-size: 26px; font-weight: 700; }
  .tokens .lbl { color: var(--dim); font-size: 12px; }
  .tokens .cell { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
  .tok-row { display: flex; justify-content: space-between; font-size: 12px; padding: 3px 0; border-bottom: 1px dotted var(--line); }
  .saved { color: var(--good); }
  #runSelWrap { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--dim); margin-top: 10px; }
  .legend span::before { content: "■"; margin-right: 4px; }
  .lg-tool { color: var(--acc); } .lg-del { color: var(--good); } .lg-u { color: var(--u); }
  .lg-tok { color: var(--warn); } .lg-err { color: var(--bad); }
  .quiet { color: var(--dim); font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>🔑 keeper 驾驶舱 <span class="quiet">agent loop · 实时</span></h1>
  <div id="runSelWrap">
    <select id="runSel"></select>
    <button id="reloadRuns">刷新 run 列表</button>
    <span id="conn">未连接</span>
  </div>
</header>

<main>
  <section>
    <div class="card">
      <h2>事件时间线（每格 = loop 的一步）</h2>
      <div id="timeline"><div class="quiet">等待事件…（选择 run 后自动回放历史 + 实时尾随）</div></div>
    </div>
    <div class="legend">
      <span class="lg-tool">工具调用 / discard 申报</span>
      <span class="lg-del">插件删除生效</span>
      <span class="lg-u">tagger 行集</span>
      <span class="lg-tok">压缩前/后视图</span>
      <span class="lg-err">跳过 / 错误</span>
    </div>
  </section>

  <aside style="display:flex;flex-direction:column;gap:14px">
    <div class="card">
      <h2>Token 面板（动态累计）</h2>
      <div class="tokens">
        <div class="cell"><div class="lbl">输入 total</div><div class="big" id="tokIn">0</div></div>
        <div class="cell"><div class="lbl">输出 total</div><div class="big" id="tokOut">0</div></div>
        <div class="cell"><div class="lbl">总消耗</div><div class="big" id="tokTotal">0</div></div>
        <div class="cell"><div class="lbl">压缩节省</div><div class="big saved" id="tokSaved">0</div></div>
      </div>
      <div style="margin-top:10px">
        <div class="lbl" style="margin-bottom:4px">逐轮明细</div>
        <div id="tokRounds"><span class="quiet">暂无轮次</span></div>
      </div>
      <div style="margin-top:8px">
        <div class="lbl" style="margin-bottom:4px">最近一轮输入环比</div>
        <div id="tokDelta">—</div>
      </div>
    </div>

    <div class="card">
      <h2>压缩前后对比（A vs B）</h2>
      <div id="viewDiff"><span class="quiet">尚未产生对比</span></div>
    </div>
  </aside>
</main>

<script>
'use strict';
const $ = (id) => document.getElementById(id);

// ---------- run 列表 ----------
async function loadRuns() {
  try {
    const r = await fetch('/api/runs');
    const { runs } = await r.json();
    const sel = $('runSel');
    const prev = sel.value;
    sel.innerHTML = runs.map((x) => `<option value="${x.id}">${x.id} · ${x.events} 事件 · ${(x.updatedAt||'').slice(0,19)}</option>`).join('');
    if (runs.length === 0) sel.innerHTML = '<option value="">（无 run）</option>';
    if (prev && runs.some((x) => x.id === prev)) sel.value = prev;
    if (sel.value) startStream(sel.value);
    return runs;
  } catch (e) { setConn('err', '列表加载失败'); return []; }
}

// ---------- SSE 事件流 ----------
let es = null, curRun = null, first = true;
function startStream(run) {
  if (es) { es.close(); es = null; }
  curRun = run; first = true;
  if (!run) { timeline.innerHTML = '<div class="quiet">选择 run</div>'; resetTokens(); return; }
  resetTokens();
  timeline.innerHTML = '<div class="quiet">回放中…</div>';
  setConn('live', `连接 run=${run}`);
  es = new EventSource(`/api/events?run=${encodeURIComponent(run)}`);
  es.onopen = () => setConn('live', `已连接 run=${run}`);
  es.onmessage = (e) => {
    let ev; try { ev = JSON.parse(e.data); } catch { return; }
    if (first && ev.type === 'run_start') { first = false; }
    if (first) { timeline.innerHTML = ''; first = false; }
    appendEvent(ev);
  };
  es.onerror = () => setConn('err', '断线，自动重连中…');
}

// ---------- token 面板 ----------
const acc = { input: 0, output: 0, saved: 0, rounds: [] };
function resetTokens() {
  acc.input = 0; acc.output = 0; acc.saved = 0; acc.rounds = [];
  $('tokIn').textContent = '0'; $('tokOut').textContent = '0';
  $('tokTotal').textContent = '0'; $('tokSaved').textContent = '0';
  $('tokRounds').innerHTML = '<span class="quiet">暂无轮次</span>';
  $('tokDelta').textContent = '—';
  $('viewDiff').innerHTML = '<span class="quiet">尚未产生对比</span>';
}
function onTokenRound(ev) {
  const input = ev.input ?? 0, output = ev.output ?? 0, saved = ev.saved ?? 0;
  acc.input += input; acc.output += output; acc.saved += saved;
  acc.rounds.push(ev);
  $('tokIn').textContent = acc.input.toLocaleString();
  $('tokOut').textContent = acc.output.toLocaleString();
  $('tokTotal').textContent = (acc.input + acc.output).toLocaleString();
  $('tokSaved').textContent = acc.saved.toLocaleString();
  const n = acc.rounds.length;
  const last = acc.rounds[n - 1], prev = n >= 2 ? acc.rounds[n - 2] : null;
  const usage = ev.usage ? `usage 实测 ${ev.usage.prompt_tokens ?? '?'}/${ev.usage.completion_tokens ?? '?'}` : (ev.usage_note || '本地估算');
  $('tokRounds').innerHTML =
    acc.rounds.map((r, i) =>
      `<div class="tok-row"><span>R${i + 1} · 入 ${(r.input ?? 0).toLocaleString()} · 出 ${(r.output ?? 0).toLocaleString()}</span>` +
      `<span class="${(r.saved ?? 0) > 0 ? 'saved' : 'quiet'}">省 ${(r.saved ?? 0).toLocaleString()}</span></div>`).join('') +
    `<div class="tok-row quiet"><span>最新轮：${usage}</span></div>`;
  $('tokDelta').textContent = prev === null
    ? '—'
    : `${last.input - prev.input >= 0 ? '+' : ''}${(last.input - prev.input).toLocaleString()} tokens`;
}
function onView(ev) {
  const v = ev.type === 'view_before' ? 'A（压缩前组装）' : 'B（插件压缩后）';
  const saved = ev.saved;
  $('viewDiff').innerHTML =
    `<div class="tok-row"><span>${v} tokens</span><span>${(ev.tokens ?? 0).toLocaleString()}</span></div>` +
    `<div class="tok-row"><span>字符数</span><span>${(ev.n_chars ?? 0).toLocaleString()}</span></div>` +
    `<div class="tok-row"><span>消息条数</span><span>${ev.n_messages ?? '-'}</span></div>` +
    (saved !== undefined ? `<div class="tok-row saved"><span>本轮节省</span><span>${saved.toLocaleString()} tok</span></div>` : '');
}

// ---------- Tag/index ----------
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function card(tag, cls, meta, body) {
  const el = document.createElement('div');
  el.className = `ev c-${cls}`;
  el.innerHTML = `<div class="h"><span class="tag">${tag}</span><span class="meta">${meta}</span></div>${body || ''}`;
  return el;
}

function appendEvent(ev) {
  const tl = $('timeline');
  if (ev.type === 'run_start') { tl.innerHTML = ''; }
  let el = null;
  switch (ev.type) {
    case 'run_start':
      el = card('🚀 run_start', 'tool_call', ev.ts, `<div>version ${ev.version ?? '-'} · run ${esc(ev.run)}</div>`);
      break;
    case 'tool_call':
      el = card('🔧 tool_call', 'tool_call', ev.ts,
        `<div>工具 <code>${esc(ev.tool)}</code> 参数：<code>${esc(JSON.stringify(ev.args))}</code> <span class="quiet">(经 ${esc(ev.via)} 剥离辅助字段)</span></div>`);
      break;
    case 'tagger_doc':
      el = card('🏷 tagger_doc', 'tagger_doc', ev.ts,
        `<div>doc <code>${esc(ev.doc_id)}</code> · ${ev.n_rows ?? '?'} 行 · ${ev.n_sections ?? '?'} section · 原文 ${ev.n_chars ?? '?'} 字符</div>` +
        rowsetPreview(ev));
      break;
    case 'assistant_discard':
      el = card('🧠 assistant_discard（LLM 申报）', 'assistant_discard', ev.ts,
        `<div>doc <code>${esc(ev.doc_id ?? '-')}</code> 申报删除行：${(ev.discard_lines || []).map((x) => `<code class="n-del">${x}</code>`).join(' ')}</div>`);
      break;
    case 'discard_applied':
      el = card('✂ discard_applied（插件生效）', 'discard_applied', ev.ts,
        `<div>doc <code>${esc(ev.doc_id)}</code> 删 <span class="n-del">${ev.n_del}</span> 行 → 剩 <b>${ev.n_left}</b> 行（n 不变号）</div>`);
      break;
    case 'view_before':
    case 'view_after':
      el = card(ev.type === 'view_before' ? '📦 view A · 压缩前' : '📦 view B · 压缩后', 'view_before', ev.ts,
        `<div>tokens <b>${(ev.tokens ?? 0).toLocaleString()}</b> · 字符 ${(ev.n_chars ?? 0).toLocaleString()} · 消息 ${ev.n_messages ?? '-'}${ev.saved !== undefined ? ` · <span class="saved">本轮节省 ${ev.saved.toLocaleString()}</span>` : ''}</div>`);
      break;
    case 'token_round':
      el = card('💰 token_round', 'token_round', ev.ts, '');
      onTokenRound(ev);
      break;
    case 'tool_result_error':
      el = card('⚠ tool_result_error（不计入候选）', 'tool_result_error', ev.ts, `<div>工具 <code>${esc(ev.tool)}</code> 出错：${esc(ev.note || '')}</div>`);
      break;
    case 'discard_empty':
      el = card('⚠ discard_empty', 'discard_empty', ev.ts, '<div>discard_lines 为空数组 → 本轮无删除</div>');
      break;
    case 'compress_skip':
      el = card('⏭ compress_skip', 'compress_skip', ev.ts, `<div>原因：${esc(ev.reason)} ${ev.doc_id ? `doc=${esc(ev.doc_id)}` : ''}</div>`);
      break;
    case 'doc_already_pruned':
      el = card('♻ doc_already_pruned', 'compress_skip', ev.ts, `<div>doc <code>${esc(ev.doc_id)}</code> 已是上轮产物，跳过</div>`);
      break;
    case 'payload_doc':
      el = card('🗄 payload_doc（外联）', 'tagger_doc', ev.ts,
        `<div>doc <code>${esc(ev.doc_id)}</code> 大内容已外联 <code>${esc(ev.payload_ref)}</code>（${ev.n_rows ?? '?'} 行）</div>`);
      break;
    case 'run_finalized':
      el = card('🏁 run_finalized', 'tool_call', ev.ts,
        `<div>共 ${ev.events_total ?? '?'} 事件 · 降级 ${ev.warn_fallbacks ?? 0} 次</div>`);
      break;
    case 'run_stats':
      el = card('📊 run_stats', 'tool_call', ev.ts, `<pre>${esc(JSON.stringify(ev.stats ?? {}, null, 1))}</pre>`);
      break;
    default:
      el = card(ev.type ?? 'event', 'tool_call', ev.ts, `<pre>${esc(JSON.stringify(ev, null, 1))}</pre>`);
  }
  if (el) { tl.appendChild(el); scrolldown(tl); }
}

function rowsetPreview(ev) {
  if (!ev.sections && !ev.doc) return '';
  const secs = ev.sections || (ev.doc ? ev.doc.sections : []);
  const rows = (secs[0] || {}).rows || [];
  if (rows.length === 0) return '';
  const kc = { h: 'h', v: 'v', t: 't', u: 'u' };
  const head = (secs[0].source && secs[0].source.name) || '';
  return `<table><thead><tr><th>n</th><th>k</th><th>内容</th></tr></thead><tbody>` +
    rows.map((r) => `<tr><td>${r.n}</td><td class="lg-${kc[r.k] || 't'}">${r.k}</td><td>${esc(r.t)}</td></tr>`).join('') +
    `</tbody></table><div class="quiet">来源：${esc(head)}</div>`;
}

function scrolldown(tl) { if (tl.scrollHeight - tl.scrollTop - tl.clientHeight < 400) { tl.scrollTop = tl.scrollHeight; } }
function setConn(cls, txt) { const c = $('conn'); c.className = cls; c.textContent = txt; }

$('reloadRuns').addEventListener('click', loadRuns);
$('runSel').addEventListener('change', (e) => startStream(e.target.value));
loadRuns();
</script>
</body>
</html>
