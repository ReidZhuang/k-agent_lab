server:
  host: 0.0.0.0
middleman:
  host: localhost
  port: 8311
  workers: 4
  type_a_max_workers: 24
  type_a_queue_timeout: 300
  type_b_max_workers: 64
  type_b_queue_timeout: 120
  # 资讯/公告日期窗口(显式起始/终止日期表达式, 非天数):
  #   today / today_or_last_trading / prev_trading_day(N) / YYYYMMDD
  # 普通资讯+公告 = 近5个交易日; qnainfo 保持现状(今天往前5个交易日)
  date_range:
    sinafin:  {start: "prev_trading_day(4)", end: "today_or_last_trading"}
    baidufin: {start: "prev_trading_day(4)", end: "today_or_last_trading"}
    thsfin:   {start: "prev_trading_day(4)", end: "today_or_last_trading"}
    thsnews:  {start: "prev_trading_day(4)", end: "today_or_last_trading"}
    juchao:   {start: "prev_trading_day(4)", end: "today_or_last_trading"}
    qnainfo:  {start: "prev_trading_day(5)", end: "today_or_last_trading"}
writer:
  host: localhost
  port: 8310
  workers: 4
  main_pool_workers: 4
  sub_worker_max_workers: 64
  sub_writer_total_timeout: 1500  # sub writer 对 reporter 的总闸(秒): 首次请求开始计时, 非 ok 无限重试, 到点直接失败
reporter:
  host: localhost
  port: 8312
  workers: 8
  thread_pool_size: 64
  max_loop_rounds: 8
  article_timeout: 600
  prompts_dir: prompts_v3
  article_tool_name: fetch_article_body  # 与 prompts(agent.md/soul.md/SKILL.md)中的工具名统一
  deepseek:
    model: deepseek-v4-flash
    max_tokens: 64000
    api_base: https://api.deepseek.com
    timeout: 180          # read(空闲)超时: 两次数据之间的最大间隔, 非总时长
    connect_timeout: 10   # 建立连接超时
    max_retries: 2        # SDK 对超时/429/5xx 的重试次数(最多 3 次尝试), 每次尝试独立请求
database:
  path: /home/stockagent/project_space/database/report_market.db
logging:
  level: INFO
mail_tower:
  base_url: http://localhost:8300
  search_timeout: 150
  poll_interval: 3
  max_poll_attempts: 100
